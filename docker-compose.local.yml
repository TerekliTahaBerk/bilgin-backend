# YALNIZCA yerel geliştirme ve imajı denemek için.
#
# Adı bilerek "docker-compose.yml" DEĞİL: Coolify repo'da o adı görünce
# Compose dağıtımını önerir ve seçilirse buradaki Postgres'i ayağa kaldırır —
# yani üretim, içinde "local-parola" yazan bir veritabanıyla açılırdı.
#
# Çalıştırmak için:  docker compose -f docker-compose.local.yml up -d
services:
  app:
    build: .
    ports: ['8080:8080']
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: base64:mPQ+xDOfzAO7Dh0fgvBKxLn9lFXQmIKLPf/etAPz+vc=
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_DATABASE: tekrarla
      DB_USERNAME: tekrarla
      DB_PASSWORD: local-parola
      # Redis açıksa önbellek ve kuyruk oraya alınır — tek değişiklik bu.
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      LOG_CHANNEL: stderr
      TRUSTED_PROXIES: '*'
      CORS_ALLOWED_ORIGINS: '*'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tekrarla
      POSTGRES_USER: tekrarla
      POSTGRES_PASSWORD: local-parola
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tekrarla']
      interval: 5s
      retries: 10
    volumes: ['pgdata:/var/lib/postgresql/data']

  redis:
    image: redis:7-alpine

volumes:
  pgdata:

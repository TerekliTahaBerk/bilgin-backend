user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    client_max_body_size 16M;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;

        # Belge kökü public/ — kök dizini göstermek .env dahil her dosyayı
        # internete açardı.
        root /app/public;
        index index.php;

        # Ters vekil arkasında gerçek istemci IP'si; TRUSTED_PROXIES ile
        # birlikte rate limit ve denetim kaydını doğru tutar.
        real_ip_header X-Forwarded-For;
        set_real_ip_from 0.0.0.0/0;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            include fastcgi_params;
            fastcgi_read_timeout 60;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Gizli dosyalar (.env, .git) hiçbir koşulda servis edilmemeli.
        location ~ /\. { deny all; }
    }
}

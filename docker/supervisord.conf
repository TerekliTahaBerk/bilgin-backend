[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; Zamanlayıcı konteynerin İÇİNDE.
;
; Harici cron kurmak yerine schedule:work kullanmanın sebebi: cron
; kurulmayı unutulan bir şeydir ve unutulduğunda lig haftaları sessizce
; kapanmaz — hata da vermez. Konteyner ayaktaysa zamanlayıcı da ayakta.
[program:scheduler]
command=php /app/artisan schedule:work --no-interaction
user=www-data
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; Kuyruk işçisi. Şu an kuyruğa iş atan kod yok ama push bildirimleri
; eklendiğinde hazır olsun; boşta kaynak tüketmez.
;
; --max-time: işçi saatte bir yeniden başlar. Uzun ömürlü PHP süreçleri
; bellek sızdırır; periyodik yeniden başlatma bunun standart çözümü.
[program:queue]
command=php /app/artisan queue:work --tries=3 --sleep=3 --max-time=3600 --no-interaction
user=www-data
autorestart=true
numprocs=1
priority=40
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; Üretim ayarları.
memory_limit = 512M
upload_max_filesize = 16M
post_max_size = 16M
max_execution_time = 60

; Hata çıktısı asla yanıta karışmamalı; log'a gider.
display_errors = Off
log_errors = On
error_log = /dev/stderr

; OPcache — üretimde derlenmiş kod bellekte tutulur.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.interned_strings_buffer = 16

; Konteynerde kod değişmediği için dosya zaman damgası kontrolü kapalı.
; Yeni sürüm = yeni imaj = yeni konteyner.
realpath_cache_size = 4096k
realpath_cache_ttl = 600
